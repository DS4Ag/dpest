### Contains the cabbage CROPGRO model .CUL and .ECO default parameter groups
#### and the OVERVIEW.OUT variables classification

# Arguments for the CROPGRO Cabbage CULTIVAR template file function
CULTIVAR_TPL_FILE:

    # Casification into groups of CULTIVAR parameters
    PARAMETERS:
        # Parameter_group:
        # - Values
        PHOTO:      # Photoperiod sensitivity
            - CSDL
            - PPSEN
        PHEN:       # Reproductive phase durations (photothermal)
            - EM-FL
            - FL-SH
            - FL-SD
            - SD-PM
            - FL-LF
        LEAF_PHYS:  # Leaf photosynthesis & morphology
            - LFMAX
            - SLAVR
            - SIZLF
        PART_SEED:  # Partitioning to seed and seed traits
            - XFRT
            - WTPSD
            - SFDUR
            - SDPDV
            - PODUR
            - THRSH
        SEED_COMP:  # Seed composition
            - SDPRO
            - SDLIP

# Arguments for the CROPGRO Soybean ECOTYPE template file function
ECOTYPE_TPL_FILE:

    # Casification into groups of ECOTYPE parameters
    PARAMETERS:
        # Parameter_group:
        # - Values

        EARLY_PHEN: # Early vegetative and juvenile development
            - PL-EM
            - EM-V1
            - V1-JU
            - JU-R0

        REPRO_TIMING: # Pod and shell development timing
            - THVAR
            - PM06
            - PM09
            - LNGSH
            - R7-R8
            - FL-VS

        LEAF_APP:   # Leaf appearance rate
            - TRIFL

        CANOPY_FORM: # Relative canopy size and shape
            - RWDTH
            - RHGHT

        POST_R1_PHOT: # Post-flowering photoperiod sensitivity
            - R1PPO

        LOWT_FLO:   # Low-temperature effect on flowering
            - OPTBI
            - SLOBI


#~~~~~~ OVERVIEW
OVERVIEW_FILE:

    # Classification into groups of the OVERVIEW file variables. Seas = seasonal
    VARIABLES_CLASSIFICATION:
        # Variable: group
    VARIABLES_CLASSIFICATION:
        Emergence day (dap): pheno_seas
        Anthesis day (dap): pheno_seas
        First pod day (dap): pheno_seas
        First seed day (dap): pheno_seas
        Physiological maturity day (dap): pheno_seas
        Harvest maturity day (dap): pheno_seas

        Yield at harvest maturity (kg [dm]/ha): yield_seas
        Pod/Ear/Panicle weight at maturity (kg [dm]/ha): yield_seas
        Number at maturity (no/m2): yield_seas
        Unit wt at maturity (g [dm]/unit): yield_seas
        Number at maturity (no/unit): yield_seas
        Harvest index at maturity: yield_seas
        Threshing % at maturity: yield_seas

        Tops weight at anthesis (kg [dm]/ha): biom_seas
        Tops weight at maturity (kg [dm]/ha): biom_seas
        By-product produced (stalk) at maturity (kg[dm]/ha): biom_seas

        Leaf area index, maximum: lai_seas

        Leaf number per stem at maturity: pheno_seas
        Canopy height (m): morph_seas

        Tops N at anthesis (kg/ha): nitro_seas
        Tops N at maturity (kg/ha): nitro_seas
        Stem N at maturity (kg/ha): nitro_seas
        Grain N at maturity (kg/ha): nitro_seas
        Grain N at maturity (%): nitro_seas

        Grain oil at maturity (%): qual_seas
